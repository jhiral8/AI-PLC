name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Plugin bundles are up to date
        run: pnpm bundle && git diff --exit-code plugins/coreflow/scripts
      - name: Nothing in this repo's own traces is suspect
        run: node plugins/coreflow/scripts/coreflow.mjs suspects --check
      - name: The example's business-case gate passes
        working-directory: examples/passwordless-login
        run: node ../../plugins/coreflow/scripts/coreflow.mjs gate
